name: Release

# Builds, tests, packs and publishes a release, started by hand from the
# Actions tab (or through the API) with the version and the notes.
#
# Releases used to be made on the author's machine and uploaded from there.
# This does the same steps on a clean runner, so a release can be made from
# anywhere, and what is published is exactly what was tested: the zip holds
# the Bin\StarMon.exe the self-test run below was built beside.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, three numbers, e.g. 1.3.0"
        required: true
      notes:
        description: "Release notes, in Markdown"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    # Inputs are passed through the environment rather than pasted into the
    # scripts, so nothing typed into the form can become a command
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "The version must be three dot-separated numbers; got '$env:VERSION'."
          }
          if (git ls-remote --tags origin "refs/tags/v$env:VERSION") {
            throw "v$env:VERSION is already tagged. A release is never made over an existing tag."
          }

      # The same entry point and the same shell as the build workflow
      - name: Build and self-test
        shell: powershell
        run: .\build.ps1 -Test -Version "$env:VERSION.0"

      # Packed the way the earlier releases were: the application, its
      # configuration, and the documents that explain it
      - name: Pack
        shell: pwsh
        run: |
          $name = "StarMon-$env:VERSION-win64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory (Join-Path $stage "docs") | Out-Null
          Copy-Item Bin\StarMon.exe, Bin\StarMon.exe.config, Bin\StarMon.xml, README.md, LICENSE.md $stage
          Copy-Item docs\ARCHITECTURE.md (Join-Path $stage "docs")
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "$name.zip"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-Content -Path notes.md -Value $env:NOTES -Encoding utf8NoBOM
          gh release create "v$env:VERSION" "StarMon-$env:VERSION-win64.zip" `
            --target $env:GITHUB_SHA `
            --title "StarMon $env:VERSION" `
            --notes-file notes.md
