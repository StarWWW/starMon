name: Release

# Builds, tests, packs and publishes a release. Started either by pushing a
# version tag (v1.4.0), whose annotation becomes the notes, or by hand from the
# Actions tab with the version and the notes.
#
# Releases used to be made on the author's machine and uploaded from there.
# This does the same steps on a clean runner, so a release can be made from
# anywhere, and what is published is exactly what was tested: the zip holds
# the Bin\StarMon.exe the self-test run below was built beside.

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, three numbers, e.g. 1.3.0"
        required: true
      notes:
        description: "Release notes, in Markdown"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    # Inputs are passed through the environment rather than pasted into the
    # scripts, so nothing typed into the form can become a command
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      NOTES: ${{ inputs.notes }}
      FROM_TAG: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      # The SDK of the major version the project targets, as the build
      # workflow does
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the version
        shell: pwsh
        run: |
          $version = $env:VERSION -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The version must be three dot-separated numbers; got '$env:VERSION'."
          }
          # Started by hand, the tag is made here, and never over one that
          # exists. Started by a tag, that tag is the release.
          if ($env:FROM_TAG -ne 'true' -and (git ls-remote --tags origin "refs/tags/v$version")) {
            throw "v$version is already tagged. A release is never made over an existing tag."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The same entry point and the same shell as the build workflow
      - name: Build and self-test
        shell: powershell
        run: .\build.ps1 -Test -Version "$env:VERSION.0" -VersionWord Release

      # Packed the way the earlier releases were: the application, its
      # configuration, and the documents that explain it. There is no
      # StarMon.exe.config any more: it meant something only to .NET Framework.
      - name: Pack
        shell: pwsh
        run: |
          $name = "StarMon-$env:VERSION-win64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory (Join-Path $stage "docs") | Out-Null
          Copy-Item Bin\StarMon.exe, Bin\StarMon.xml, README.md, LICENSE.md $stage
          Copy-Item docs\ARCHITECTURE.md (Join-Path $stage "docs")
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "$name.zip"

      # A tagged release takes its notes from the tag's annotation
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:FROM_TAG -eq 'true') {
            git fetch --force origin "refs/tags/v$($env:VERSION):refs/tags/v$($env:VERSION)"
            $notes = git tag -l --format='%(contents)' "v$env:VERSION"
          } else {
            $notes = $env:NOTES
          }
          Set-Content -Path notes.md -Value $notes -Encoding utf8NoBOM
          gh release create "v$env:VERSION" "StarMon-$env:VERSION-win64.zip" `
            --target $env:GITHUB_SHA `
            --title "StarMon $env:VERSION" `
            --notes-file notes.md
